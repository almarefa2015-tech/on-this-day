name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip app package
        run: |
          if [ -f "on-this-day-android (2).zip" ]; then
            unzip -o "on-this-day-android (2).zip"
          elif [ -f "on-this-day-android (1).zip" ]; then
            unzip -o "on-this-day-android (1).zip"
          else
            unzip -o on-this-day-android.zip
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform & sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -d "android-icon" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            cp -rf android-icon/* android/app/src/main/res/
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: on-this-day-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
